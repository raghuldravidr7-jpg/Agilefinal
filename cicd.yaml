name: CI/CD Pipeline for Shopping Bill Calculator

on:
  push:
    branches: [ main ]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest

      - name: Generate unique Docker tag
        id: meta
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill-app:${{ steps.meta.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill-app:latest

      - name: Set up Kubernetes (kubectl)
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes and Expose Service
        run: |
          sed -i "s|IMAGE_TAG|${{ steps.meta.outputs.TAG }}|g" k8s-deployment.yaml
          kubectl apply -f k8s-deployment.yaml
          kubectl apply -f k8s-service.yaml
